name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev libxkbcommon-dev libwayland-dev
      - run: cargo build --release --locked
      - name: Package Linux archive
        run: |
          mkdir -p stage/docs
          install -m 755 target/release/ravel stage/ravel
          cp README.md LICENSE stage/
          cp docs/*.md stage/docs/
          tar -czf ravel-linux-x86_64.tar.gz -C stage ravel README.md LICENSE docs
      - uses: actions/upload-artifact@v4
        with:
          name: ravel-linux-x86_64
          path: ravel-linux-x86_64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Package Windows archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path stage/docs -Force | Out-Null
          Copy-Item target/release/ravel.exe, README.md, LICENSE stage/
          Copy-Item docs/*.md stage/docs/
          Compress-Archive -Path stage/* -DestinationPath ravel-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ravel-windows-x86_64
          path: ravel-windows-x86_64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Import Developer ID certificate and package
        shell: bash
        env:
          RAVEL_CERTIFICATE_P12_BASE64: ${{ secrets.RAVEL_CERTIFICATE_P12_BASE64 }}
          RAVEL_CERTIFICATE_PASSWORD: ${{ secrets.RAVEL_CERTIFICATE_PASSWORD }}
          RAVEL_CODESIGN_IDENTITY: ${{ secrets.RAVEL_CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          : "${RAVEL_CERTIFICATE_P12_BASE64:?Missing macOS signing certificate}"
          : "${RAVEL_CERTIFICATE_PASSWORD:?Missing macOS certificate password}"
          : "${RAVEL_CODESIGN_IDENTITY:?Missing macOS signing identity}"
          certificate="$RUNNER_TEMP/ravel-certificate.p12"
          keychain="$RUNNER_TEMP/ravel-signing.keychain-db"
          password="$(openssl rand -hex 24)"
          trap 'security delete-keychain "$keychain" >/dev/null 2>&1 || true; rm -f "$certificate"' EXIT
          printf '%s' "$RAVEL_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security import "$certificate" -k "$keychain" -P "$RAVEL_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          RAVEL_VERSION="${GITHUB_REF_NAME#v}" sh package/macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ravel-macos
          path: dist/ravel-macos-*.zip

  publish:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ravel-*
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
