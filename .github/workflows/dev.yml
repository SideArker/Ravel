name: development-builds
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev libxkbcommon-dev libwayland-dev
      - run: cargo test --workspace --locked
      - name: Native capture regressions
        if: runner.os == 'Windows'
        run: cargo test -p input-capture --locked
      - run: cargo build --locked
      - uses: actions/upload-artifact@v4
        with:
          name: ravel-dev-${{ runner.os }}
          path: |
            target/debug/ravel
            target/debug/ravel.exe
            README.md
            LICENSE
            docs/
