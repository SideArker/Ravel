name: native-builds
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check Linux installer syntax
        if: runner.os == 'Linux'
        run: sh -n install.sh
      - name: Check Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install.ps1).Path, [ref]$tokens, [ref]$errors) > $null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev libxkbcommon-dev libwayland-dev xvfb xauth
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - name: Isolated X11 input lifecycle
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x720x24 -nolisten tcp" env -u WAYLAND_DISPLAY XDG_SESSION_TYPE=x11 RAVEL_TEST_X11=1 cargo test input::native_tests::x11_edge_capture_injection_stop_and_cleanup --locked -- --ignored
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: ravel-${{ runner.os }}
          path: |
            target/release/ravel
            target/release/ravel.exe
            README.md
            LICENSE
            docs/
